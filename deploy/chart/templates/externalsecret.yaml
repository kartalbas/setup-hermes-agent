# The one secret every workload reads. `remoteRef.key` is fixed by the platform's
# layout, and gate G7 admits only properties that deploy/platform.yaml declares under
# secrets[] — so adding a key here without declaring it there fails the render, which
# is the point.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "unit.name" . }}
  labels:
    {{- include "unit.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "unit.name" . }}
    kind: SecretStore
  target:
    name: {{ include "unit.name" . }}
    creationPolicy: Owner
  data:
    {{- range $key := list
        "AZURE_TENANT_ID" "MAIL_CLIENT_ID"
        "TEAMS_SECRETARY_CLIENT_ID" "TEAMS_SECRETARY_CLIENT_SECRET"
        "TEAMS_SEARCH_CLIENT_ID" "TEAMS_SEARCH_CLIENT_SECRET"
        "TEAMS_NEWS_CLIENT_ID" "TEAMS_NEWS_CLIENT_SECRET"
        "TEAMS_GITHUB_CLIENT_ID" "TEAMS_GITHUB_CLIENT_SECRET"
        "TEAMS_ADMIN_CLIENT_ID" "TEAMS_ADMIN_CLIENT_SECRET"
        "TEAMS_TASKS_CLIENT_ID" "TEAMS_TASKS_CLIENT_SECRET"
        "TEAMS_ALLOWED_OBJECT_IDS"
        "DEEPSEEK_API_KEY" "GITHUB_TOKEN"
        "GOOGLE_OAUTH_CLIENT_ID" "GOOGLE_OAUTH_CLIENT_SECRET"
        "TASKS_GROUP_ID" "TASKS_ASSIGNEE_ID"
        "EMAIL_PASSWORD" "DASHBOARD_PASSWORD" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ include "unit.stage" $ }}/consumer/{{ include "unit.name" $ }}/app
        property: {{ $key }}
    {{- end }}
