# The identity the ExternalSecret operator logs into Vault as. The two annotations are
# not decoration: the `consumer-eso` role lifts them into its alias metadata, and its
# policy admits <stage>/consumer/<unit>/* through exactly those two values. Gate G7
# fails the render when either is missing or names another unit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "unit.name" . }}
  labels:
    {{- include "unit.labels" . | nindent 4 }}
  annotations:
    vault.hashicorp.com/alias-metadata-unit: {{ include "unit.name" . }}
    vault.hashicorp.com/alias-metadata-stage: {{ include "unit.stage" . }}
