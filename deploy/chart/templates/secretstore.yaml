# Where the unit's secrets come from. The role and the server address are both held
# against the cluster by gate G7: the role must be `consumer-eso`, and the server must
# equal the value the platform's own chain sets for global.endpoints.vault.url — which
# is why it is read from values and never written here as a literal.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "unit.name" . }}
  labels:
    {{- include "unit.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ required "global.endpoints.vault.url is set by the platform's value chain" .Values.global.endpoints.vault.url | quote }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: consumer-eso
          serviceAccountRef:
            name: {{ include "unit.name" . }}
