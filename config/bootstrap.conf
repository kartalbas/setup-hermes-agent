# shellcheck shell=bash disable=SC2034
#
# The account everything else happens in.
#
# Read by BOTH scripts, so they cannot disagree about who the agent is:
# bootstrap.sh creates the account, install.sh installs for it.
#
# The installer deliberately does not take the account from whoever invoked it.
# A run must produce the same installation whether it was started from an
# administrator account or from the agent's own — otherwise "run the installer"
# stops describing one thing.
#
# Running bootstrap.sh is optional. To have the agent run as an account that
# already exists, name it here and go straight to install.sh.

# Name of the account to create.
BOOTSTRAP_USER="hermes"

# Its home. A normal home, not the agent's data directory: this is somewhere a
# person logs in and works.
BOOTSTRAP_HOME=""                  # empty = /home/<user>

# Where the repository is placed inside that home.
BOOTSTRAP_DEST=""                  # empty = <home>/setup-hermes-agent

# Grant passwordless sudo.
#
# Required for the operating model — everything is installed and updated from
# inside this account, which needs root for packages and services. It also means
# the agent, which runs as this account and reads untrusted input, can reach
# root. See docs/decisions/0016; set false to keep the older, narrower posture
# and run the installer from elsewhere.
BOOTSTRAP_GRANT_SUDO=true

# Copy the invoking administrator's authorized_keys, so the account can be
# reached by the same key. Without it, and without a password, there is no way
# in except `sudo -u <user> -i`.
BOOTSTRAP_COPY_SSH=true
