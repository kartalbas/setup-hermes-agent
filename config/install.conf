# shellcheck shell=bash disable=SC2034
#
# What gets installed on the host.
#
# Tracked in git, unlike hermes.conf and channels.conf: a list of tools is the
# same everywhere and carries no site data. Site-specific settings — endpoints,
# accounts, hostnames, credentials — belong in the other two files.
#
# Loaded first, so anything here can be overridden per host.

# =============================================================================
#  Developer tools
#
#  Installed natively into DEVTOOLS_BIN_DIR, which is on the system PATH, so the
#  service account can run them. Tools installed inside a container sandbox are
#  invisible to an agent running on the host — whichever side executes the
#  agent's commands is the side that needs them.
#
#  Remove what you do not want. A tool with no recipe is reported and skipped,
#  it does not stop the run; recipes live in src/58-devtools.sh.
# =============================================================================

DEVTOOLS_MANAGE=true
DEVTOOLS_BIN_DIR="/usr/local/bin"

# Resolving "latest release" costs one GitHub API call per unpinned tool, and
# the unauthenticated limit is 60 per hour per IP. A catalogue this size fits
# once; a second run inside the hour does not. Name a variable in SECRETS_FILE
# holding a GitHub token to raise the limit to 5000/h — the token needs no
# scopes at all, it only reads public releases. Empty = unauthenticated.
DEVTOOLS_GITHUB_TOKEN_VAR="GITHUB_TOKEN"

DEVTOOLS_INSTALL="
  kubectl helm kustomize k9s kubectx kubens stern helmfile kubeconform kind
  argocd argo flux kubeseal velero
  terraform tofu terragrunt tflint terraform-docs ansible
  vault sops age git-crypt
  trivy cosign syft grype hadolint
  crane dive skopeo
  jq yq gojq dasel jless jsonnet yamllint
  gh lazygit delta just task pre-commit direnv
  ripgrep fd-find bat fzf tree httpie
  shellcheck bats k6
  yt-dlp ffmpeg unzip make build-essential pkg-config python3-pip python3-venv
"

# Pin any single tool when a version matters. Everything else tracks the
# vendor's latest release.
#DEVTOOLS_PIN_KUBECTL="v1.31.0"
#DEVTOOLS_PIN_TERRAFORM="1.9.8"


# =============================================================================
#  Subscription CLIs
#
#  Installed for the service account, because both the binary and the sign-in
#  belong to whichever account runs them — an administrator's login does not
#  carry over to a service.
#
#  The browser authorisation cannot be scripted. The run installs and verifies,
#  then prints the exact command for the one step you have to do yourself.
# =============================================================================

CLIS_MANAGE=true
CLIS_INSTALL="agy claude"

CLI_URL_AGY="https://antigravity.google/cli/install.sh"
CLI_URL_CLAUDE="https://claude.ai/install.sh"


# =============================================================================
#  Git behaviour for the service account
#
#  The identity itself (name and address) is site data and lives in the site
#  configuration. These are the settings that make git usable by something that
#  is never at a keyboard: no pager waiting for a keypress, no editor waiting
#  for a message, no push failing on a missing upstream.
# =============================================================================

GIT_MANAGE=true
GIT_DEFAULT_BRANCH="main"
GIT_PULL_REBASE=true
GIT_EDITOR="true"          # never open an editor; "true" exits successfully
GIT_PAGER="cat"            # never page; a pager blocks a non-interactive caller
GIT_CONFLICT_STYLE="zdiff3"

# Git over SSH. The provisioner generates a key for the service account and
# prints the public half at the end of the run — adding it to the forge is the
# one step nobody can automate.
GIT_SSH_MANAGE=true
GIT_SSH_KEY_TYPE="ed25519"
GIT_SSH_HOSTS="github.com"
GIT_FORCE_SSH=true         # rewrite https remotes to ssh so pushes use the key

# Extra settings, one KEY=VALUE per line:
#GIT_EXTRA_CONFIG="
#  diff.algorithm=histogram
#  core.autocrlf=input
#"


# =============================================================================
#  Credential files
#
#  Whole files the provisioner deploys from config/credentials/ onto the host —
#  as opposed to the values in the secrets file. Nothing here has to be produced
#  by hand on the target: it is prepared in the repository first.
#
#  Format, one per line:   relative/source -> ~/destination MODE [optional]
#
#  Without "optional", a missing source stops the run: it was declared, so its
#  absence is a mistake rather than a state. With it, the absence is reported
#  and the run continues — which is right for credentials that can equally well
#  be established by signing in on the host.
#
#  The SSH key is not optional and does not need to be supplied: the run
#  generates it here on first use, so that it can be registered with a git forge
#  before installing and survives a rebuild of the host.
# =============================================================================

CREDENTIAL_FILES="
  ssh/id_ed25519      -> ~/.ssh/id_ed25519     0600
  ssh/id_ed25519.pub  -> ~/.ssh/id_ed25519.pub 0644
  agy/oauth-token     -> ~/.gemini/antigravity-cli/antigravity-oauth-token 0600 optional
"
